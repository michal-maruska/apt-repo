name: Update Apt Repo
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Empty the pool!'
        type: boolean
        default: false

  repository_dispatch:
    types: [new-deb-package]


run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && (inputs.bootstrap && 'Bootstrap' || 'Manual run')
      || format('Import: {0} {1}',
           github.event.client_payload.repository,
           github.event.client_payload.version) }}


permissions:
  contents: write   # Needed to push the DB back to the branch
#  contents: write          # release upload/edit; in the caller, not just here
  pages: write      # Needed to upload the web artifact
  id-token: write   # Needed for the secure deployment handshake


concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  reprepro:
    runs-on: ubuntu-latest
    # container: debian:sid
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro git

      - name: Checkout Config (Main)
        uses: actions/checkout@v5
        with:
          path: main-source

      - uses: michal-maruska/workflows/actions/restore-state@main
        with:
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bootstrap: ${{ inputs.bootstrap }}

      # not in git anymore:
      # - name: Checkout Data (apt-storage)
      #   uses: actions/checkout@v5
      #   with:
      #     ref: apt-storage
      #     path: apt-data
      #     token: ${{ secrets.PAT_TOKEN }}

      - name: Sanitize Reprepro
        run: |
          ldd $(which reprepro) |grep libdb
          # Try to list references. If it fails (non-zero exit code), the DB is incompatible.
          if ! reprepro -b ./apt-data --confdir ./main-source/conf dumpreferences > /dev/null 2>&1; then
              echo "Database incompatible or corrupt. Rebuilding..."
              rm -rf ./apt-data/db
          fi

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # todo: can you run as "builder" ?

          # Fix for GPG in containers: avoid "Inappropriate ioctl for device"
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf

          # Decode and import
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import

          # Restart agent
          gpgconf --kill gpg-agent

          # huh?
          GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | \
          awk -F: '/^fpr/{print $10; exit}')
          echo "$GPG_FINGERPRINT:6:" | gpg --import-ownertrust

      - name: Download New Package
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p incoming
          # Use the payload sent from your slave repo
          # Force gh to tell us what it's doing
          gh release download ${{ github.event.client_payload.version }} \
               --repo ${{ github.event.client_payload.repository }} \
               --dir ./incoming \
               --skip-existing

      - name: Run Reprepro
        if: github.event_name == 'repository_dispatch'
        run: |
          # Use config from main, but write data to apt-data folder

          set -- ./incoming/*.changes
          if [ -e "$1" ]; then
            for changes in ./incoming/*.changes
            do
               reprepro -b ./apt-data \
                   --confdir ./main-source/conf \
                   include sid $changes
            done
          else
              # if no .changes files,  then just manually includedeb sid *.deb ?
              echo "no .changes files, checking for bare .debs instead"
              set -- ./incoming/*.deb
              if [ -e "$1" ];
              then
                 for deb in ./incoming/*.deb; do
                     reprepro -b ./apt-data --confdir ./main-source/conf \
                     includedeb sid "$deb"
                 done
              else
                 echo "nothing to include"
              exit 1
              fi
          fi

      - uses: michal-maruska/workflows/actions/save-state@main
        with:
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage site
        run: |
          mkdir site
          cp -a apt-data/dists apt-data/pool site/
          cp main-source/maruska.asc site/ 2>/dev/null || true
          python3 ./main-source/gen-index.py ./site/
          touch ./site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # should ignore .git !
          path: './site' # Now contains dists, pool, public.key, and .nojekyll


  deploy: # This is your deployment job name
    needs: reprepro
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest # or debian:sid if you are using that
    steps:
      # ... your previous steps (upload, etc) ...
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

