name: apt-repo cleanup
on:
  workflow_dispatch:
    inputs:
      keep:
        description: Versions to keep per package/arch
        default: "1"
      dbgsym:
        description: Remove all *-dbgsym packages
        type: boolean
        default: true
      sources:
        description: Remove all source packages
        type: boolean
        default: true
      apply:
        description: Actually delete (otherwise dry run)
        type: boolean
        default: false

concurrency:
  group: apt-repo          # use the same group in the import/publish workflow
  cancel-in-progress: false

env:
  RELEASE_TAG: reprepro-state
  REPO: ${{ github.repository }}

permissions:
  contents: write      # releases + assets

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      REPREPRO_BASE_DIR: ${{ github.workspace }}/apt-data      # state from cache/release
      REPREPRO_CONFIG_DIR: ${{ github.workspace }}/main-source/conf    # from git
    steps:
# exactly copied:
      - name: drop failing deb-source repositories
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
          /etc/apt/sources.list.d/azure-cli.* \
          /etc/apt/sources.list.d/microsoft*.sources

      - name: Install Tools
        timeout-minutes: 5
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          if ! sudo timeout 120 apt-get update $APT; then
             echo "Azure mirror failed, falling back to archive.ubuntu.com"
             sudo sed -i 's|^URIs:.*|URIs: http://archive.ubuntu.com/ubuntu/|' \
             /etc/apt/sources.list.d/ubuntu.sources
             sudo timeout 120 apt-get update $APT
          fi
          sudo apt-get install -y $APT reprepro

      - name: Checkout Config (Main)
        uses: actions/checkout@v5
        with:
          path: main-source

      - name: Restore cache
        id: cache
        if: ${{ !inputs.bootstrap }}
        uses: actions/cache@v5
        with:
          path: |
            apt-data/pool
            apt-data/dists
            apt-data/db
          key: reprepro-${{ github.run_id }}
          restore-keys: |
                 reprepro-

      - name: Restore from release if cache missed
        if: steps.cache.outputs.cache-matched-key == '' && !inputs.bootstrap
        # if: steps.cache.outputs.cache-hit != 'true' && !inputs.bootstrap
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern reprepro-state.tar.gz \
            --repo $REPO || true
          if [ -f reprepro-state.tar.gz ]; then
            tar xzf reprepro-state.tar.gz
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize Reprepro
        run: |
          ldd $(which reprepro) |grep libdb
          # Try to list references. If it fails (non-zero exit code), the DB is incompatible.
          if ! reprepro -b ./apt-data --confdir ./main-source/conf dumpreferences > /dev/null 2>&1; then
              echo "Database incompatible or corrupt. Rebuilding..."
              rm -rf ./apt-data/db
          fi

# now
      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # todo: can you run as "builder" ?

          # Fix for GPG in containers: avoid "Inappropriate ioctl for device"
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf

          # Decode and import
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import

          # Restart agent
          gpgconf --kill gpg-agent

          # huh?
          GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | \
          awk -F: '/^fpr/{print $10; exit}')
          echo "$GPG_FINGERPRINT:6:" | gpg --import-ownertrust


      # restore repo state exactly as the publish workflow does:
      #   actions/cache restore + release fallback
      - name: Show current state
        run: |
          reprepro --delete clearvanished
          reprepro list sid | sort -t: -k 2
          reprepro dumpunreferenced     # empty => not in reprepro's db either

      - name: Sweep orphaned pool files
        run:  cd ./apt-data; ../main-source/sweep-orphans ${{ inputs.apply && '--apply' || '' }}


      - name: Remove dbgsym
        if: ${{ inputs.dbgsym }}
        run: |
          if [ "${{ inputs.apply }}" = true ]; then
            reprepro removefilter sid 'Package (% *-dbgsym)'
          else
            reprepro listfilter sid 'Package (% *-dbgsym)'
          fi
      - name: Remove sources
        if: ${{ inputs.sources }}
        run: |
          if [ "${{ inputs.apply }}" = true ]; then
            reprepro -T dsc removefilter sid 'Package (% *)'
          else
            reprepro -T dsc list sid
          fi
      - name: Prune old versions
        run: python3 main-source/prune-apt.py --keep "${{ inputs.keep }}" ${{ inputs.apply && '--apply' || '' }}
      - name: Delete unreferenced files
        if: ${{ inputs.apply }}
        run: reprepro -b repo deleteunreferenced

      # if apply: save state back to cache/release, then republish Pages

      - name: Save to release
        if: ${{ inputs.apply }}
        run: |
          tar czf reprepro-state.tar.gz apt-data/{pool,dists,db}

          # create the release only if it doesn't already exist
          # todo: reprepro-state should be a variable.
          gh release view reprepro-state --repo "$REPO" >/dev/null 2>&1 || \
          gh release create reprepro-state \
          --title "reprepro state" \
          --notes "initial" \
          --prerelease \
          --repo "$REPO"

          # upload/overwrite the asset in place — no delete, no gap
          gh release upload "$RELEASE_TAG" reprepro-state.tar.gz \
          --clobber \
          --repo $REPO

          gh release edit "$RELEASE_TAG" --notes "Run ${{ github.run_id }}" --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save cache
        uses: actions/cache/save@v5
        with:
          path: |
            apt-data/pool
            apt-data/dists
            apt-data/db
            key: reprepro-${{ github.run_id }}
